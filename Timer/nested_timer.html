<p id="demo" style="text-align:center; font-size:50px; font-weight:bold; 
color:black; top:40%; left:50%; transform:translate(-50%, -50%); position:relative;">
</p>
<div id="product">
      <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=464&auto=format&fit=crop" style="width:500px; height:500px; cursor:pointer; position:absolute; 
      top:50%; left:50%; transform:translate(-50%, -50%);">
</div>

<p id="sale" style="text-align:center; font-size:45px; font-weight:bold; color:red; display:none;
   position:absolute; top:20%; left:50%; transform:translate(-50%, -50%);">
</p>
<div id="lastmsg" style="font-size:45px; font-weight:bold; position:absolute; top:50%; left:50%;
     transform:translate(-50%, -50%);">
      Now sale is Ended
</div>

<script>
      document.getElementById( 'demo' ).style.display = 'block';
      document.getElementById( 'product' ).style.display = 'none';
      document.getElementById( 'lastmsg' ).style.display = 'none';  

      var countDownDate = new Date();
      countDownDate.setSeconds( countDownDate.getSeconds() + 10 );
      countDownDate = countDownDate.getTime();

      var x = setInterval( function () {
            var now = new Date().getTime();
            var distance = countDownDate - now;
            var seconds = Math.floor( ( distance % ( 1000 * 60 ) ) / 1000 );

            document.getElementById( "demo" ).innerHTML = seconds + "s ";

            if ( distance < 0 ) {
                  clearInterval( x );
                  document.getElementById( 'product' ).style.display = 'block';
                  document.getElementById( "demo" ).style.display = 'none';
                  document.getElementById( 'sale' ).style.display = 'block';
                  salepro();

                  salepro();
            }
      }, 1000 );

      function salepro() {
            document.getElementById( 'lastmsg' ).style.display = 'none';

            var d = new Date();
            d.setMinutes( d.getMinutes() + 1 );
            var countDownDate = d.getTime();

            var y = setInterval( function () {
                  var now = new Date().getTime();
                  var distance = countDownDate - now;

                  var days = Math.floor( distance / ( 1000 * 60 * 60 * 24 ) );
                  var hours = Math.floor( ( distance % ( 1000 * 60 * 60 * 24 ) ) / ( 1000 * 60 * 60 ) );
                  var minutes = Math.floor( ( distance % ( 1000 * 60 * 60 ) ) / ( 1000 * 60 ) );
                  var seconds = Math.floor( ( distance % ( 1000 * 60 ) ) / 1000 );

                  var  a = document.getElementById( "sale" ).innerHTML =
                        days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
                  console.log(a);
                  if ( distance < 0 ) {
                        clearInterval( y );
                       document.getElementById( 'product' ).style.display = 'none';
                        document.getElementById( 'sale' ).style.display = 'none';  
                        document.getElementById( 'lastmsg' ).style.display = 'block';

                  }
            }, 1000 );
      }
</script>
