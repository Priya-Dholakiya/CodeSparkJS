<style>
      /* Round scroll indicator */
      #scrollCircle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            height: 70px;
            width: 70px;
            border-radius: 50%;
            background: #111;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 9999;
      }

      /* Popup msg box */
      #popupMsg {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #ff9900;
            color: #000;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 18px;
            display: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
            from {
                  opacity: 0;
            }

            to {
                  opacity: 1;
            }
      }
</style>

<!-- Scroll Indicator -->
<div id="scrollCircle">0%</div>

<!-- Popup Message -->
<div id="popupMsg">🎉 Aapne 50% website dekh li hai!</div>

<!-- Dummy content (scroll karne ke liye) -->
<div style="height:2000px; padding:20px;">
      <h1>Scroll Down to See Indicator...</h1>
</div>

<script>
      let popupShown = false; // message ek hi baar dikhane ke liye

      window.addEventListener( 'scroll', () => {
            let scrolly = window.scrollY;
            let innerHeight = window.innerHeight;
            let bodyHeight = document.body.scrollHeight;

            let total = bodyHeight - innerHeight;
            let percent = Math.round( ( scrolly / total ) * 100 );

            // Update round circle
            document.getElementById( "scrollCircle" ).innerText = percent + "%";

            // 50% hone par message show
            if ( percent >= 50 && !popupShown ) {
                  document.getElementById( "popupMsg" ).style.display = "block";
                  popupShown = true;

                  // 3 seconds baad message hide
                  setTimeout( () => {
                        document.getElementById( "popupMsg" ).style.display = "none";
                  }, 3000 );
            }
      } );
</script>
