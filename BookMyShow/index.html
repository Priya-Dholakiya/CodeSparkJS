<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>BookMyShow Clone</title>
</head>

<body style="margin:0; padding:0; box-sizing:border-box; font-family:Kanit; background:#fff;">

      <!-- HEADER -->
      <header
            style="height:64px; padding:13px 40px; display:flex; align-items:center; justify-content:space-between; background:#fff;">
            <div>
                  <img src="Images/logo.png" style="height:35px;">
            </div>

            <div style="flex:1; padding:0 25px;">
                  <input type="search" placeholder="Search for Movies, Events, Plays, Sports and Activities"
                        style="width:100%; padding:10px 15px; border-radius:6px; border:1px solid #ccc; font-size:14px;">
            </div>

            <div style="display:flex; align-items:center; gap:20px;">
                  <select style="border:none; background:transparent;">
                        <option>Mumbai</option>
                        <option>Delhi</option>
                        <option>Surat</option>
                        <option>Chennai</option>
                  </select>

                  <button style="padding:8px 20px; background:#F84464; border:none; color:white; border-radius:6px;">
                        Sign in
                  </button>

                  <img src="Images/toggle.png" style="width:24px;">
            </div>
      </header>

      <!-- NAV BAR -->
      <section style="height:41px; background:#f5f5f5; display:flex; align-items:center; padding:0 40px;">
            <ul style="display:flex; gap:25px; list-style:none; margin:0; padding:0;">
                  <li><a href="#" style="text-decoration:none; color:#333; font-weight:500;">Movies</a></li>
                  <li><a href="form.html" style="text-decoration:none; color:#333; font-weight:500;">Add Movies</a></li>
            </ul>
      </section>

      <!-- SLIDER -->
      <div
            style="width:1230px; height:291px; overflow:hidden; position:relative; margin:25px auto; border-radius:12px;">

            <div id="track" style="display:flex; width:4920px; height:291px; transition:0.6s ease;">

                  <div style="width:1230px; height:291px; background:url('Images/slide1.avif') center/cover no-repeat;">
                  </div>

                  <div style="width:1230px; height:291px; background:url('Images/slide2.avif') center/cover no-repeat;">
                  </div>

                  <div style="width:1230px; height:291px; background:url('Images/slide3.avif') center/cover no-repeat;">
                  </div>

                  <div style="width:1230px; height:291px; background:url('Images/slide4.avif') center/cover no-repeat;">
                  </div>

            </div>

            <button onclick="prev()"
                  style="position:absolute; top:50%; left:10px; transform:translateY(-50%); background:white; border:none; font-size:26px; padding:8px 14px; cursor:pointer; border-radius:50%;">
                  ‹
            </button>

            <button onclick="next()"
                  style="position:absolute; top:50%; right:10px; transform:translateY(-50%); background:white; border:none; font-size:26px; padding:8px 14px; cursor:pointer; border-radius:50%;">
                  ›
            </button>
      </div>

      <!-- CATEGORY -->
      <section
            style="padding:0 40px; margin-top:25px; display:flex; justify-content:space-between; align-items:center;">
            <h4 style="font-size:22px; font-weight:600;">Recommended Movies</h4>
            <a href="#" style="color:#F84464; text-decoration:none;">See All ›</a>
      </section>
      <!-- movies-card -->
      <div id="cards" style="display:grid; grid-template-columns:repeat(5,1fr); gap:25px; padding:30px 40px;">
      </div>

      <!-- JS -->
      <script>
            let index = 0;
            let track = document.getElementById( "track" );

            function next() {
                  index++;
                  if ( index > 3 ) index = 0;
                  track.style.transform = "translateX(-" + index * 1230 + "px)";
            }

            function prev() {
                  index--;
                  if ( index < 0 ) index = 3;
                  track.style.transform = "translateX(-" + index * 1230 + "px)";
            }
            var movies = JSON.parse( localStorage.getItem( "movies" ) ) || [];

            var html = "";

            movies.forEach( m => {
                  html += `
  <div style="background:#fff;border-radius:12px;overflow:hidden;transition:0.3s;border:1px solid #eee;">
      <img src="${ m.img }" style="width:100%;height:300px;object-fit:content;background:#000;image-rendering:auto;filter:contrast(1.5);transform:translateZ(0);">

    <div style="padding:12px;">
      <h4 style="margin:0; font-size:16px; font-weight:600;">
        ${ m.title }
      </h4>
      <p style="margin:6px 0; font-size:14px; color:#555;">
        ⭐ ${ m.rating } | ${ m.votes }
      </p>
      <p style="margin:0; font-size:13px; color:#777;">
        ${ m.type } • ${ m.lang }
      </p>
      <a href="${ m.trailer }" target="_blank"style="display:inline-block;margin-top:10px;padding:6px 10px;background:#F84464;color:white;font-size:13px;text-decoration:none;border-radius:5px;">Watch Trailer
      </a>
    </div></div>`;
            } );
            document.getElementById( "cards" ).innerHTML = html;
      </script>
</body>
</html>
