<form onsubmit="return submitForm(event)">
      Enter Name : <input type="text" id="name" required><br><br>
      Enter Age : <input type="number" id="age" required><br><br>
      <input type="submit" value="Submit" style="width: 100px; height: 50px; font-size: 20px;">
</form>

<p id="Res" style="display:none; color: green;"></p>

<script>
      var data = [
            { name: "Priya", age: 22 },
            { name: "Anu", age: 21 }
      ];
      startFunction();

      function startFunction() {
            var dataconvert = JSON.stringify( data );
            localStorage.setItem( "Student_Data", dataconvert );
      }

      function submitForm( e ) {
            e.preventDefault();

            var name = document.getElementById( "name" ).value;
            var age = document.getElementById( "age" ).value;

            var newdata = {
                  name: name,
                  age: age
            };

            data.push( newdata );
            startFunction();

            document.getElementById( "Res" ).innerHTML = "Data Added Successfully!";
            document.getElementById( "Res" ).style.display = "block";

            setTimeout( () => {
                  document.getElementById( "Res" ).style.display = "none";
            }, 3000 );

            return false;
      }
</script>
