<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <title>Login</title>
</head>
.btn {
padding: 9px 15px;
background: linear-gradient(45deg, #b3a7ab, #ff4d6d);
color: white;
border: none;
border-radius: 6px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: 0.9s;
}

.btn:hover {
transform: scale(1.05);
}
</style>
<body style="font-family:Arial;background:#f7f7f7">

      <h2 style="text-align:center">Login</h2>

      <form onsubmit="login(event)" style="width:300px;margin:auto">
            <input id="user" placeholder="Username" required><br><br>
            <input id="pass" type="password" placeholder="Password" required><br><br>
            <button class="btn">Login</button>
      </form>

      <script>
            function login( e ) {
                  e.preventDefault();

                  let u = document.getElementById( "user" ).value;
                  let p = document.getElementById( "pass" ).value;

                  let users = JSON.parse( localStorage.getItem( "users" ) ) || [];

                  let valid = users.find( x => x.username == u && x.password == p );

                  if ( valid ) {
                        localStorage.setItem( "token", "yes" );
                        alert( "Login success" );
                        window.location = "index.html";
                  } else {
                        alert( "Invalid user" );
                  }
            }
      </script>

</body>

</html>
