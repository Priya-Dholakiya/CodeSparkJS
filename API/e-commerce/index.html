<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <title>Products</title>
      
</head>
<style>
      .btn {
            padding: 9px 15px;
            background: linear-gradient(45deg, #b3a7ab, #ff4d6d);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.9s;
      }

      .btn:hover {
            transform: scale(1.05);
      }
</style>
<body style="font-family:Arial;background:#f7f7f7;margin:0">

      <div style="padding:15px;background:#c7003d;color:white;display:flex;justify-content:space-between">
            <h2>My Store</h2>
            <div>
                  <button class="btn" onclick="goToCart()">Cart 🛒 (<span id="cartCount">0</span>)</button>
                  <button class="btn" onclick="logout()">Logout</button>
            </div>
      </div>

      <h2 style="text-align:center">All Products</h2>

      <div id="productData" style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center"></div>

      <script>
            function updateCartCount() {
                  let cart = JSON.parse( localStorage.getItem( "cartData" ) ) || [];
                  document.getElementById( "cartCount" ).innerText = cart.length;
            }
            updateCartCount();

            fetch( "https://fakestoreapi.com/products" )
                  .then( res => res.json() )
                  .then( data => {
                        let html = "";
                        data.forEach( p => {
                              html += `
<div onclick="viewProduct(${ p.id })" style="width:200px;background:#fff;padding:10px;border:1px solid #ddd;cursor:pointer">
<div style="flex:1;display:flex;justify-content:center;align-items:center">
<img id="image"src="${p.image}" style="max-width:200px;max-height:150px;object-fit:contain">
</div>
<h4>${ p.title }</h4>
<p style="color:red">₹ ${ p.price }</p>
</div>`;
                        } );
                        document.getElementById( "productData" ).innerHTML = html;
                  } );

            function viewProduct( id ) {
                  localStorage.setItem( "productId", id );
                  window.location = "singleProduct.html";
            }

            function goToCart() {
                  window.location = "cart.html";
            }

            function logout() {
                  localStorage.removeItem( "token" );
                  window.location = "login.html";
            }
      </script>

</body>

</html>
