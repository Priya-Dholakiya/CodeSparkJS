<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <title>Single Product</title>
      <style>
            .btn {
padding: 9px 15px;
background: linear-gradient(45deg, #b3a7ab, #ff4d6d);
color: white;
border: none;
border-radius: 6px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: 0.9s;
}

.btn:hover {
transform: scale(1.05);
}
      </style>
</head>

<body style="font-family:Arial;background:#f7f7f7">

      <div style="padding:15px;background:#c7003d;color:white">
            <button class="btn"onclick="goHome()">⬅ Back to Home</button>
            <button class="btn"onclick="goToCart()">Cart 🛒 (<span id="cartCount">0</span>)</button>
      </div>

      <div style="display:flex;gap:30px;padding:40px">

            <div style="flex:1;display:flex;justify-content:center;align-items:center">
                  <img id="image" style="max-width:300px;max-height:300px;object-fit:contain">
            </div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:15px">
      <h2 id="title" style="color:#333"></h2>
      <h3 id="price" style="color:#c7003d"></h3>

      <div id="btn"></div>
</div>

      </div>

      <script>
            let id = localStorage.getItem( "productId" );

            fetch( `https://fakestoreapi.com/products/${ id }` )
                  .then( res => res.json() )
                  .then( p => {
                        document.getElementById( "image" ).src = p.image;
                        document.getElementById( "title" ).innerText = p.title;
                        document.getElementById( "price" ).innerText = "₹ " + p.price;

                        let token = localStorage.getItem( "token" );

                        if ( token ) {
                              document.getElementById( "btn" ).innerHTML =
                                    `<button class="btn"onclick="addToCart('${ p.image }','${ p.title }',${ p.price })">Add to Cart</button>`;
                        } else {
                              document.getElementById( "btn" ).innerHTML =
                                    `<button class="btn"onclick="goLogin()">Login First</button>`;
                        }
                  } );

            function addToCart( image, title, price ) {
                  let cart = JSON.parse( localStorage.getItem( "cartData" ) ) || [];

                  let exist = cart.find( i => i.title === title );

                  if ( exist ) {
                        if ( exist.qty >= 5 ) {
                              alert( "Max 5 only" );
                              return;
                        }
                        exist.qty++;
                  } else {
                        cart.push( { image, title, price, qty: 1 } );
                  }

                  localStorage.setItem( "cartData", JSON.stringify( cart ) );
                  updateCartCount();
                  alert( "Added to cart" );
            }

            function updateCartCount() {
                  let cart = JSON.parse( localStorage.getItem( "cartData" ) ) || [];
                  document.getElementById( "cartCount" ).innerText = cart.length;
            }
            updateCartCount();

            function goHome() {
                  window.location = "index.html";
            }

            function goToCart() {
                  window.location = "cart.html";
            }

            function goLogin() {
                  window.location = "login.html";
            }
      </script>

</body>

</html>
