<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <title>Expense Tracker Using JavaScript</title>
      <link rel="shortcut icon" href="Images/favicon.png" type="image/x-icon">
      <style>
            th,
            td {
                  border: 1px solid #ddd;
                  padding: 8px;
                  text-align: center;
            }
            input,
            select,
            button {
                  width: 100%;
                  padding: 6px;
                  margin: 6px 0;
            }
            button {
                  background: #b3acac;
                  color: #030303;
                  cursor: pointer;
                  font-weight: 700;
            }
      </style>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background: #f2f2f2; padding: 10px;">

      <div class="container" style="max-width: 900px; margin: auto;">

            <h2 style="text-align:center">Expense Tracker Using JavaScript</h2>

            <div class="balance" style="background-color: white; padding: 20px; text-align: center; margin-bottom: 20px; text-align: center; box-shadow:inset 0 0 10px rgba(0, 0, 0, 0.2); border-radius: 10px;">
                  <h3>✔ Balance: <span id="balance">0</span></h3>
                  <p>
                        Total Income: <span class="green" id="income" style="color: green; font-weight: 900;">0</span> |
                        Total Expenses: <span class="red" id="expense" style="color: red; font-weight: 900;">0</span>
                  </p>
            </div>

            <div class="flex" style="display: flex; gap: 20px;">
                  <!-- Form -->
                  <div class="box" style="background-color: white; width: 50%; padding: 20px; box-shadow:inset 0 0 10px rgba(0, 0, 0, 0.2); border-radius: 10px;" >
                        <h3>Expenses</h3>
                        <table style="width: 100%; border-collapse: collapse;">
                              <thead>
                                    <tr>
                                          <th style="background-color: #6aff6a;">Sno.</th>
                                          <th style="background-color: #6aff6a;">Name</th>
                                          <th style="background-color: #6aff6a;">Amount</th>
                                          <th style="background-color: #6aff6a;">Type</th>
                                          <th style="background-color: #6aff6a;">Delete</th>
                                    </tr>
                              </thead>
                              <tbody id="list"></tbody>
                        </table>
                  </div>

                  <!-- User Input -->
                  <div class="box"  style="background-color: white; width: 50%; padding: 20px; box-shadow:inset 0 0 10px rgba(0, 0, 0, 0.2); border-radius: 10px;">
                        <h3>Add new</h3>

                        <label>Entry type</label>
                        <select id="type">
                              <option value="">--Select Type--</option>
                              <option value="income">Income</option>
                              <option value="expense">Expense</option>
                        </select>

                        <label>Name</label>
                        <input type="text" id="name">

                        <label>Amount</label>
                        <input type="number" id="amount">

                        <button onclick="add()">Add Expense</button>
                  </div>

            </div>
      </div>

      <script>
            let data = JSON.parse( localStorage.getItem( "expenseData" ) ) || [];

            function add() {
                  let name = document.getElementById( "name" ).value;
                  let amount = Number( document.getElementById( "amount" ).value );
                  let type = document.getElementById( "type" ).value;

                  if ( name == "" || amount <= 0 ) {
                        alert( "Fill all fields" );
                        return;
                  }

                  data.push( { name, amount, type } );
                  localStorage.setItem( "expenseData", JSON.stringify( data ) );
                  document.getElementById( "name" ).value = "";
                  document.getElementById( "amount" ).value = "";
                  show();
            }

            function del( i ) {
                  data.splice( i, 1 );
                  localStorage.setItem( "expenseData", JSON.stringify( data ) );
                  show();
            }

            function show() {
                  let list = document.getElementById( "list" );
                  list.innerHTML = "";
                  let inc = 0, exp = 0;

                  data.forEach( ( d, i ) => {
                        d.type == "income" ? inc += d.amount : exp += d.amount;
                        list.innerHTML += `
                        <tr>
                              <td>${ i + 1 }</td>
                              <td>${ d.name }</td>
                              <td>${ d.amount }</td>
                              <td>${ d.type == "income" ? "✔" : "❌" }</td>
                              <td><button onclick="del(${ i })">X</button></td>
                        </tr>`;
                  } );

                  document.getElementById( "income" ).innerText = inc;
                  document.getElementById( "expense" ).innerText = exp;
                  document.getElementById( "balance" ).innerText = inc - exp;
            }
            show();
      </script>

</body>

</html>
