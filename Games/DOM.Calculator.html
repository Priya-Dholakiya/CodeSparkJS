<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
</head>
<body>
<input type="text" id="result" style="text-align: right;"><br>
<button>%</button>
<input type="button" value="C" id="clearInput">
<input type="button" value="CE" id="clearlastchar">
<button>+</button><br>
<button>7</button>
<button>8</button>
<button>9</button>
<button>*</button><br>
<button>4</button>
<button>5</button>
<button>6</button>
<button>/</button><br>
<button>1</button>
<button>2</button>
<button>3</button>
<button>-</button><br>
<input type="button" value="+/-" id="inversign">
<button>0</button>
<button>.</button>
<input type="button" value="=" id="output"><br>

<script>
let result = document.getElementById('result');
let buttons = document.querySelectorAll('button');
let clearInput = document.getElementById('clearInput');
let clearlastchar = document.getElementById('clearlastchar');
let inversign = document.getElementById('inversign');
let output = document.getElementById('output');

clearInput.addEventListener('click',()=>{ result.value=''; });

clearlastchar.addEventListener('click',()=>{ result.value = result.value.slice(0,-1); });

output.addEventListener('click',()=>{ 
    try { result.value = eval(result.value); } 
    catch { result.value='Error'; }
});

// Simple +/- logic aapke style me
inversign.addEventListener('click',()=>{
    let data = result.value;
    if(!data) return;

    // last operator find
    let pos=-1;
    for(let i=data.length-1;i>=0;i--){
        if(['+','-','*','/','%'].includes(data[i])){
            pos=i;
            break;
        }
    }

    // last number extract
    let lastNumStr = data.slice(pos+1);
    let lastNum = Number(lastNumStr);

    // toggle sign
    lastNum = -lastNum;

    // update value
    result.value = data.slice(0,pos+1) + lastNum;
});

// number/operator buttons
buttons.forEach(btn=>{
    if(['=','CE','%','+/-','←'].includes(btn.innerText)) return;
    btn.addEventListener('click',()=>{
        let val = btn.innerText;
        let last = result.value.slice(-1);
        if(['+','-','*','/','%'].includes(last) && ['+','-','*','/','%'].includes(val)) return;
        result.value += val;
    });
});
</script>
</body>
</html>
