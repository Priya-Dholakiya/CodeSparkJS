<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Responsive Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .slider {
            width: 80%;
            /* responsive width */
            max-width: 1230px;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .track {
            display: flex;
            transition: 0.6s ease;
        }

        .slide {
            min-width: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 400px;
            /* fixed height but can adjust */
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            font-size: 26px;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 1);
        }

        #prev {
            left: 10px;
        }

        #next {
            right: 10px;
        }
    </style>
</head>

<body>

    <div class="slider">
        <div class="track" id="track">
            <div class="slide"><img
                    src="https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=1200&q=80"
                    alt=""></div>
            <div class="slide"><img
                    src="https://images.unsplash.com/photo-1454023492550-5696f8ff10e1?auto=format&fit=crop&w=1200&q=80"
                    alt=""></div>
            <div class="slide"><img
                    src="https://images.unsplash.com/photo-1487014679447-9f8336841d58?auto=format&fit=crop&w=1200&q=80"
                    alt=""></div>
            <div class="slide"><img
                    src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80"
                    alt=""></div>
        </div>

        <button class="btn" id="prev">‹</button>
        <button class="btn" id="next">›</button>
    </div>

    <script>
        const track = document.getElementById( "track" );
        const slides = document.querySelectorAll( ".slide" );
        const slideCount = slides.length;
        let index = 0;

        document.getElementById( "next" ).onclick = function () {
            index++;
            if ( index >= slideCount ) index = 0;
            track.style.transform = `translateX(-${ index * 100 }%)`;
        }

        document.getElementById( "prev" ).onclick = function () {
            index--;
            if ( index < 0 ) index = slideCount - 1;
            track.style.transform = `translateX(-${ index * 100 }%)`;
        }
    </script>

</body>

</html>
