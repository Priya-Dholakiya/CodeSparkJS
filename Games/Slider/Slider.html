<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Fixed Size Slider</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eee;
        }

        .slider {
            width: 1230px;
            height: 291px;
            overflow: hidden;
            position: relative;
            margin: 40px auto;
            border-radius: 12px;
        }

        .track {
            display: flex;
            width: 4920px;
            height: 291px;
            transition: 0.6s ease;
        }

        .slide {
            width: 1230px;
            height: 291px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slide:nth-child(1) {
            background-image: url("https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=1200&q=80");
        }

        .slide:nth-child(2) {
            background-image: url("https://images.unsplash.com/photo-1465101178521-f7aa7c160a26?auto=format&fit=crop&w=1200&q=80");
        }

        .slide:nth-child(3) {
            background-image: url("https://images.unsplash.com/photo-1454023492550-5696f8ff10e1?auto=format&fit=crop&w=1200&q=80");
        }

        .slide:nth-child(4) {
            background-image: url("https://images.unsplash.com/photo-1487014679447-9f8336841d58?auto=format&fit=crop&w=1200&q=80");
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: none;
            font-size: 26px;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 50%;
        }

        #prev {
            left: 10px;
        }

        #next {
            right: 10px;
        }
    </style>
</head>

<body>

    <div class="slider">
        <div class="track" id="track">
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
        </div>

        <button class="btn" id="prev">‹</button>
        <button class="btn" id="next">›</button>
    </div>

    <script>
        let index = 0;
        let track = document.getElementById( "track" );

        document.getElementById( "next" ).onclick = function () {
            index++;
            if ( index > 3 ) index = 0;
            track.style.transform = "translateX(-" + index * 1230 + "px)";
        }

        document.getElementById( "prev" ).onclick = function () {
            index--;
            if ( index < 0 ) index = 3;
            track.style.transform = "translateX(-" + index * 1230 + "px)";
        }
    </script>

</body>

</html>
